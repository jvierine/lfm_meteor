[package]
name = "syisr-native"
version = "0.2.0"
edition = "2021"

[features]
default = ["plots"]
plots = ["dep:rustplotlib"]
mpi = ["dep:mpi"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
glob = "0.3"
hdf5 = { package = "hdf5-metno", version = "0.12" }
num-complex = "0.4"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
mpi = { version = "0.8.2", optional = true, default-features = false }
rustplotlib = { git = "https://github.com/jvierine/rustplotlib", rev = "f074e731c6883e7dd7abb3322a67c95341b05400", optional = true }

[dev-dependencies]
tempfile = "3"
