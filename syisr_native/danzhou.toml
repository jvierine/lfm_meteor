# Paths may be absolute; relative paths resolve against this configuration file.
station = "Danzhou"
range_coordinate = "total_path"
input_glob = "/gpfs/pub/data/L0/2026/DZ/20261117/*.dat*"
output_dir = "/home/juha/data/20261117_danzhou"
# Optional event_dir = "/another/disk/sanya-event-cuts"; default output/event_cuts.

# Header clock is assumed Beijing time. Confirm with the radar operator.
clock_utc_offset_hours = 8
# Extra IQ-sized word after the declared payload, observed in November 2026 files.
trailer_bytes = 8
# Zero makes malformed boundaries fatal. Recovery is bounded and recorded.
max_resync_bytes = 4000000
# Log incomplete or unheadered EOF blocks; never invent their pulse timestamps.
allow_orphaned_tail = true
chirp_direction = "down"
# Do not transplant the April 2024 satellite calibration to this recording.
delay_correction_us = 0.0
delay_calibration = "uncalibrated: header gate front only"

# These are apparent total transmitter-target-receiver path lengths c*tau, not heights.
min_range_km = 200.0
max_range_km = 550.0
# Peak matched-filter power / median matched-filter power in the search window.
snr_threshold_db = 14.0
max_gap_ipps = 10
min_event_pulses = 6
max_range_rate_km_s = 200.0
range_slack_km = 0.3
max_event_duration_s = 5.0
raw_padding_us = 0.0
cut_range_half_width_km = 20.0
cut_time_padding_s = 0.1
ransac_iterations = 256
ransac_min_fraction = 0.5
# Noise uses the whole recorded gate unless absolute delay bounds are supplied.
# noise_min_delay_us = 1500.0
# noise_max_delay_us = 3000.0
noise_average_pulses = 100
make_plots = true
plot_half_width_km = 2.0

# Zero means all. Use CLI overrides for a bounded local pilot.
max_files = 0
max_frames_per_file = 0
